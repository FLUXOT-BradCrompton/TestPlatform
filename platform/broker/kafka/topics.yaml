# =============================================================================
# Flux OT Platform — Kafka Topic Definitions
# AMQ Streams (Strimzi) KafkaTopic Custom Resources
# =============================================================================
# Apply with: oc apply -f topics.yaml -n fluxot
# Or: kubectl apply -f topics.yaml -n fluxot
#
# Topic naming convention: fluxot.{site_id}.{skid_type}.{skid_id}.{message_type}
#
# NOTE: Wildcard / pattern topics cannot be declared as static CRDs.
# The templates below are for representative per-site/skid instances.
# For dynamic topic creation, configure auto.create.topics.enable=false and
# use the Kafka Admin API or a topic-provisioning operator.
# =============================================================================

---
# ---------------------------------------------------------------------------
# Dead Letter Queue — shared across all sites/skids
# ---------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxot-dlq
  namespace: fluxot
  labels:
    strimzi.io/cluster: fluxot-kafka
    app.kubernetes.io/part-of: fluxot-platform
    fluxot/topic-type: dlq
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "2592000000"       # 30 days
    cleanup.policy: delete
    min.insync.replicas: "2"
    compression.type: snappy
    message.timestamp.type: LogAppendTime

---
# ---------------------------------------------------------------------------
# Template topic — Telemetry
# Replicate this block per site/skid, substituting the metadata.name and
# the topic key in config.
# Partition count 12 supports ~12 skids at high throughput per site.
# ---------------------------------------------------------------------------
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fluxot-mt-newman-belt-rip-monitor-brm-nwm-001-telemetry
  namespace: fluxot
  labels:
    strimzi.io/cluster: fluxot-kafka
    app.kubernetes.io/part-of: fluxot-platform
    fluxot/site: mt-newman
    fluxot/skid-type: belt-rip-monitor
    fluxot/message-type: telemetry
  annotations:
    fluxot/kafka-topic-name: "fluxot.mt-newman.belt_rip_monitor.brm-nwm-001.telemetry"
spec:
  topicName: "fluxot.mt-newman.belt_rip_monitor.brm-nwm-001.telemetry"
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"        # 7 days
    cleanup.policy: delete
    min.insync.replicas: "2"
    compression.type: snappy
    max.message.bytes: "1048576"     # 1 MiB
    message.timestamp.type: CreateTime
    # TimescaleDB ingestion performs well with smaller segment sizes
    segment.bytes: "268435456"       # 256 MiB

