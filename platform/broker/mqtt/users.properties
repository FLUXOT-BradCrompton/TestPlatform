# =============================================================================
# Flux OT Platform — ActiveMQ Artemis User Credentials
# =============================================================================
# Format: username=ENC(<bcrypt-hashed-password>)
#
# Plaintext passwords are listed in comments for reference during
# initial provisioning ONLY. Rotate immediately in production and
# remove the comments.
#
# Hash generation:
#   $ ./artemis user add --user <name> --password <pass> --role <role>
#   Or via API: io.netty.handler.codec.haproxy... / artemisd hash
#
# Role assignments are defined in roles.properties.
#
# NOTE: In a Kubernetes/OpenShift environment, mount this file from a
# Secret and configure ArtemisSecuritySettings to reference it.
#   secretName: fluxot-mqtt-users
#   mountPath: /opt/artemis/etc/users.properties
# =============================================================================

# ---------------------------------------------------------------------------
# Platform administrator (full access to all addresses and management)
# Plaintext: FluxOT-Admin-Broker-2024!
# ---------------------------------------------------------------------------
