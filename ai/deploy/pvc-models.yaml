#   volumeMode: Filesystem
---
# ---------------------------------------------------------------------------
# MLflow PostgreSQL data PVC (if using the bundled StatefulSet)
# Defined here for centralised storage management.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fluxot-mlflow-postgres-pvc
  namespace: fluxot-ai
  labels:
    app: mlflow-postgres
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: ml-tracking-db
    environment: production
  annotations:
    openshift.io/description: "PostgreSQL data volume for MLflow backend store"
    backup.velero.io/backup-volumes: "fluxot-mlflow-postgres-pvc"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp3-csi
  volumeMode: Filesystem
