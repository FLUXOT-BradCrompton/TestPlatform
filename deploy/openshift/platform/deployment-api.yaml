# Flux OT — Platform API Deployment
# 3 replicas with RollingUpdate, restricted security context, HA topology constraints.
# Paired with a PodDisruptionBudget to guarantee minAvailable=2 during node drain/upgrades.
#
# Apply: oc apply -f deployment-api.yaml -n fluxot-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxot-platform-api
  namespace: fluxot-platform
  labels:
    app: fluxot-platform-api
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
    environment: production
  annotations:
    deployment.kubernetes.io/revision: "1"
    # Record the image digest for auditability; update at deploy time
    fluxot.io/image-digest: ""
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fluxot-platform-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Maintain at least 2 running pods during a rolling upgrade
      maxUnavailable: 1
      maxSurge: 1
  # Keep last 3 revisions for fast rollback
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: fluxot-platform-api
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: fluxot-platform
        app.kubernetes.io/component: api
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # Rotate pods when the configmap changes (checksum annotation populated by Helm/ArgoCD)
        checksum/config: ""
    spec:
      # --------------------------------------------------------
      # Security — non-root, read-only root filesystem
      # --------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      serviceAccountName: fluxot-platform-api-sa

      # --------------------------------------------------------
      # HA: spread across availability zones and nodes
      # --------------------------------------------------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fluxot-platform-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: fluxot-platform-api

      # Prefer worker nodes with the api workload role label if present
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: fluxot-platform-api
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 60

      # --------------------------------------------------------
      # Init container — wait for TimescaleDB before starting API
      # --------------------------------------------------------
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for TimescaleDB to be ready..."
              until nc -z fluxot-timescaledb.fluxot-platform.svc.cluster.local 5432; do
                echo "  TimescaleDB not ready, sleeping 5s..."
                sleep 5
              done
              echo "TimescaleDB is ready."
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"

      # --------------------------------------------------------
      # Main container
      # --------------------------------------------------------
      containers:
        - name: platform-api
          # Production: use a pinned digest, not :latest
          # e.g., fluxot/platform-api@sha256:<digest>
          image: fluxot/platform-api:1.0.0
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # ---- Security context ----
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          # ---- Environment — non-secret config from ConfigMap ----
          envFrom:
            - configMapRef:
                name: fluxot-platform-config

          # ---- Environment — sensitive values from Secrets ----
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxot-platform-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fluxot-platform-secrets
                  key: DATABASE_URL
            - name: KAFKA_SASL_USERNAME
              value: fluxot-api-user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxot-api-user    # Created by AMQ Streams Entity Operator
                  key: password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxot-platform-secrets
                  key: SECRET_KEY
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fluxot-platform-secrets
                  key: INTERNAL_API_KEY
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fluxot-platform-secrets
                  key: MQTT_PASSWORD
            # Downward API — expose pod name/namespace for structured logging
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          # ---- Resource limits ----
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          # ---- Health probes ----
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30    # Allow 150s for slow startup (schema migrations)

          # ---- Volume mounts ----
          volumeMounts:
            # Writable /tmp for runtime scratch space (readOnlyRootFilesystem=true)
            - name: tmp-volume
              mountPath: /tmp
            # Kafka TLS truststore (CA certificate from AMQ Streams)
            - name: kafka-tls
              mountPath: /etc/kafka/tls
              readOnly: true
            # Application config overrides (optional mounted config file)
            - name: app-config
              mountPath: /etc/fluxot
              readOnly: true

      # --------------------------------------------------------
      # Volumes
      # --------------------------------------------------------
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: ""
            sizeLimit: "256Mi"
        - name: kafka-tls
          secret:
            secretName: fluxot-kafka-cluster-ca-cert
            defaultMode: 0440
        - name: app-config
          configMap:
            name: fluxot-platform-config
            defaultMode: 0440

      # --------------------------------------------------------
      # Image pull secret (if using a private registry)
      # --------------------------------------------------------
      # imagePullSecrets:
      #   - name: fluxot-registry-credentials
---
# ============================================================
# ServiceAccount for the API pods
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluxot-platform-api-sa
  namespace: fluxot-platform
  labels:
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: api
    environment: production
  annotations:
    # If using IRSA / Workload Identity, add annotation here
    # eks.amazonaws.com/role-arn: arn:aws:iam::...
---
# ============================================================
# PodDisruptionBudget — guarantee at least 2 replicas during disruptions
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluxot-platform-api-pdb
  namespace: fluxot-platform
  labels:
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: api
    environment: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: fluxot-platform-api
