# Flux OT — Platform Secrets Template
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# WARNING: This file contains PLACEHOLDER values only.
# NEVER commit real credentials to version control.
#
# Production secret management options (choose one):
#   1. SealedSecrets (Bitnami) — encrypt with kubeseal before committing:
#        kubeseal --format yaml < secret-platform.yaml > secret-platform-sealed.yaml
#        oc apply -f secret-platform-sealed.yaml
#
#   2. HashiCorp Vault + Vault Agent Injector or External Secrets Operator:
#        - Store secrets in Vault paths: secret/fluxot/platform/*
#        - Use ExternalSecret CRD to sync into Kubernetes Secrets
#
#   3. OpenShift Secrets Store CSI Driver with an external provider
#        (Vault, AWS Secrets Manager, Azure Key Vault)
#
#   4. OpenShift GitOps (ArgoCD) + SOPS encryption
#
# Replace all <PLACEHOLDER_*> values before applying.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# Apply (with real values substituted):
#   oc apply -f secret-platform.yaml -n fluxot-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: fluxot-platform-secrets
  namespace: fluxot-platform
  labels:
    app.kubernetes.io/name: platform-secrets
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: secrets
    environment: production
  annotations:
    # Remind operators this must use external secret management in production
    fluxot.io/secret-management: "sealed-secrets-or-vault"
    fluxot.io/last-rotated: "2024-01-01"
# Type Opaque — arbitrary key/value pairs
type: Opaque
# In production the values are base64-encoded by kubeseal / external secret operator.
# The stringData field is used here for template clarity — Kubernetes will base64-encode
# these values automatically on apply. Remove stringData and use data: with base64 values
# if applying directly.
stringData:
  # --------------------------------------------------------
  # Database connection
  # Full DSN including password — never log this value.
  # Format: postgresql://<user>:<password>@<host>:<port>/<dbname>?sslmode=require
  # --------------------------------------------------------
  DATABASE_URL: "postgresql://fluxot_app:<PLACEHOLDER_DB_PASSWORD>@fluxot-timescaledb.fluxot-platform.svc.cluster.local:5432/fluxot?sslmode=require"

  # Password component separately (for services that need host + password independently)
  DATABASE_PASSWORD: "<PLACEHOLDER_DB_PASSWORD>"

  # --------------------------------------------------------
  # Kafka SASL password
  # The username (fluxot-api-user) is set in the ConfigMap.
  # This secret is used by the API; bridge uses its own AMQ Streams secret.
  # --------------------------------------------------------
  KAFKA_SASL_PASSWORD: "<PLACEHOLDER_KAFKA_SASL_PASSWORD>"

  # --------------------------------------------------------
  # MQTT / AMQ Broker credentials
  # Used by the API when publishing commands via AMQP.
  # --------------------------------------------------------
  MQTT_USERNAME: "fluxot-platform-svc"
  MQTT_PASSWORD: "<PLACEHOLDER_MQTT_PASSWORD>"

  # --------------------------------------------------------
  # API application secrets
  # SECRET_KEY: used for JWT signing, CSRF tokens, session encryption.
  # Minimum 64 random bytes — generate with:
  #   python3 -c "import secrets; print(secrets.token_hex(64))"
  # --------------------------------------------------------
  SECRET_KEY: "<PLACEHOLDER_SECRET_KEY_MIN_64_BYTES_HEX>"

  # --------------------------------------------------------
  # Internal service-to-service API key
  # Used by the AI service and edge gateway to call the platform API.
  # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(48))"
  # --------------------------------------------------------
  INTERNAL_API_KEY: "<PLACEHOLDER_INTERNAL_API_KEY>"

  # --------------------------------------------------------
  # TimescaleDB admin password (used only during schema init)
  # Not injected into the application pod — only into the init container.
  # --------------------------------------------------------
  DB_ADMIN_PASSWORD: "<PLACEHOLDER_DB_ADMIN_PASSWORD>"
---
# ============================================================
# AMQ Broker admin credentials secret
# Referenced by the ActiveMQArtemis CR and broker pods.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: fluxot-amq-credentials
  namespace: fluxot-messaging
  labels:
    app.kubernetes.io/name: amq-credentials
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: messaging
    environment: production
  annotations:
    fluxot.io/secret-management: "sealed-secrets-or-vault"
type: Opaque
stringData:
  AMQ_USER: "admin"
  AMQ_PASSWORD: "<PLACEHOLDER_AMQ_ADMIN_PASSWORD>"
  # Cluster replication credentials — must match across all broker replicas
  AMQ_CLUSTER_USER: "cluster-admin"
  AMQ_CLUSTER_PASSWORD: "<PLACEHOLDER_AMQ_CLUSTER_PASSWORD>"
---
# ============================================================
# TimescaleDB credentials — used by the StatefulSet
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: fluxot-timescaledb-credentials
  namespace: fluxot-platform
  labels:
    app.kubernetes.io/name: timescaledb-credentials
    app.kubernetes.io/part-of: fluxot-platform
    app.kubernetes.io/component: database
    environment: production
  annotations:
    fluxot.io/secret-management: "sealed-secrets-or-vault"
type: Opaque
stringData:
  # PostgreSQL superuser (used for initial setup only)
  POSTGRES_PASSWORD: "<PLACEHOLDER_POSTGRES_SUPERUSER_PASSWORD>"
  # Application user
  POSTGRES_USER: "fluxot_app"
  POSTGRES_DB: "fluxot"
  APP_USER_PASSWORD: "<PLACEHOLDER_DB_PASSWORD>"
  # Replication user (if using streaming replication or Patroni)
  REPLICATION_PASSWORD: "<PLACEHOLDER_REPLICATION_PASSWORD>"
